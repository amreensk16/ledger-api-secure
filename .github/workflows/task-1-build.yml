name: task-1-build

# Superseded by task-2-pipeline.yml, which builds the same app/task-1/app
# with real security gates (SAST/secrets/SCA/image scans), dual cosign
# signing (keyless + this workflow's static key pair, so Task 1's live
# Kyverno policy keeps working), SLSA-style provenance, and a GitOps
# deploy step. Keeping this workflow's automatic push trigger active
# alongside task-2-pipeline.yml would race two independent, non-reproducible
# builds under the same commit-SHA image tag. Manual dispatch is kept for
# historical/reference use (e.g. to reproduce Task 1's build in isolation).
on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write # for keyless cosign signing via GitHub OIDC

jobs:
  build-sign-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          # Pinned to v2.x: it pushes signatures using the legacy
          # sha256-<digest>.sig tag scheme, which is what the
          # require-signed-images Kyverno policy verifies against. Newer
          # cosign (3.x) defaults to OCI 1.1 Referrers storage, which GHCR
          # does not fully support and Kyverno cannot discover as a result -
          # see task-1/docs/architecture.md for the full writeup of this issue.
          cosign-release: "v2.4.1"

      - name: Build and push (tagged by commit SHA, never :latest)
        id: build
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/ledger-api:${{ github.sha }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          docker build --provenance=false --sbom=false -t "$IMAGE" ./task-1/app
          docker push "$IMAGE"

      - name: Sign image with cosign (key pair, private key from repo secrets)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: "" # matches the empty password used when cosign.key was generated
        run: |
          echo "$COSIGN_PRIVATE_KEY" > cosign.key
          cosign sign --key cosign.key --tlog-upload=false --yes "${{ steps.build.outputs.image }}"
          rm -f cosign.key
