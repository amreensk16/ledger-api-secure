apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-api
  namespace: payments
# ledger-api never calls the Kubernetes API, so the least-privilege grant is
# zero permissions and no mounted token at all - see deployment-ledger-api.yaml
# (automountServiceAccountToken: false) and the absence of any Role/RoleBinding
# for this ServiceAccount.
automountServiceAccountToken: false
