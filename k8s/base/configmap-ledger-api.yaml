apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-api-config
  namespace: payments
data:
  LOG_LEVEL: "info"
  APP_ENV: "production"
  LEDGER_SOURCE: "static"
  # Allowlist backing the /fetch SSRF mitigation in app.py - only these
  # hostnames may be fetched, and even they are re-checked against
  # private/loopback/link-local IP ranges after DNS resolution.
  FETCH_ALLOWLIST: "example.com,httpbin.org"
