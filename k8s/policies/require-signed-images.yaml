apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-images
  annotations:
    policies.kyverno.io/title: Require Signed Images (ledger-api)
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      ledger-api images must carry a valid cosign signature from our key pair
      before they may run. Scoped to ghcr.io/<owner>/ledger-api only, since we
      can't sign third-party images (e.g. curlimages/curl) that we don't
      build ourselves - that is a deliberate scope limit, documented in the
      README, not an oversight.
spec:
  background: false
  rules:
    - name: verify-ledger-api-signature
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["payments"]
      verifyImages:
        - imageReferences:
            - "ghcr.io/GHCR_OWNER_PLACEHOLDER/ledger-api:*"
          failureAction: Enforce
          attestors:
            - count: 1
              entries:
                - keys:
                    publicKeys: |-
                      COSIGN_PUBLIC_KEY_PLACEHOLDER
